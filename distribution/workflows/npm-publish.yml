# Optional npm publish workflow — copy to .github/workflows/npm-publish.yml
# 可选：复制到 .github/workflows/npm-publish.yml 后使用。
#
# Requirements / 前置条件:
#   - repository secret NPM_TOKEN: an npm automation token with publish rights
#   - the package.json placeholders replaced (prepack refuses them)
#
# Publish a release: git tag v1.0.0 && git push origin v1.0.0
name: npm publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'
      - name: Verify the tag matches package.json
        run: |
          node -e "const p=require('./package.json');const t=process.env.GITHUB_REF_NAME.replace(/^v/,'');if(p.version!==t){console.error('tag '+t+' != package '+p.version);process.exit(1)}"
      - name: Publish with provenance
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
